# Deploy automático: todo push na master publica a bio no Cloudflare Pages
# (butiquim-bio.pages.dev, que é o que o /bio/ do domínio serve por proxy).
#
# O worker proxy (scripts/deploy-worker-proxy.mjs) NÃO entra aqui — ele só muda
# quando o roteamento muda, e é rodado na mão.
#
# O deploy manual continua valendo: npm run deploy
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-butiquim-bio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar wrangler
        run: npm i -g wrangler@4

      # O Pages publica dotfiles (foi assim que o .dev.vars vazou no butiquim-lista
      # em 22/07/2026). Aqui o deploy é da pasta inteira, então tiramos do runner o
      # que não é site antes de publicar. Não instalamos node_modules de propósito.
      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf .github .claude
          wrangler pages deploy . --project-name=butiquim-bio --branch=master --commit-dirty=true

      # Barra final obrigatória: sem ela o Pages responde 308.
      - name: Smoke test
        run: |
          falhou=0
          for URL in https://butiquim-bio.pages.dev/ https://obutiquim.com.br/bio/; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo 000)
              echo "tentativa $i: $URL -> $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then falhou=1; fi
          done
          exit $falhou

      - name: Avisar o Rafa no WhatsApp se falhou
        if: failure()
        run: |
          TEXTO=$(printf '🚨 Deploy automatico FALHOU\n\nProjeto: %s\nBranch: %s\nCommit: %s\n\nLog: %s' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          curl -s -X POST https://butiquim-lista.pages.dev/api/conferencia/enviar-ranking \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEXTO" '{texto:$t,destino:"admin"}')" | head -c 300 || true
